<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketing 3.0 Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="sidebar-head">
          <div class="brand-mark">
            <span class="mark-dot"></span>
            <div class="brand-copy">
              <strong>Marketing 3.0</strong>
              <small>目标与达成 Demo</small>
            </div>
          </div>
          <button
            id="sidebarToggle"
            class="sidebar-toggle"
            type="button"
            aria-label="折叠侧边栏"
            aria-expanded="true"
            title="折叠侧边栏"
          >
            <span class="toggle-icon" aria-hidden="true"></span>
          </button>
        </div>

        <nav class="nav-stack">
          <button class="nav-btn" data-view="gst" title="GST Dashboard">
            <span class="nav-icon" aria-hidden="true">G</span>
            <span class="nav-label">GST Dashboard</span>
          </button>
          <button class="nav-btn active" data-view="leader" title="Brand Dashboard">
            <span class="nav-icon" aria-hidden="true">B</span>
            <span class="nav-label">Brand Dashboard</span>
          </button>
          <button class="nav-btn" data-view="pic" title="PIC Dashboard">
            <span class="nav-icon" aria-hidden="true">P</span>
            <span class="nav-label">PIC Dashboard</span>
          </button>
          <button class="nav-btn" data-view="setup" title="Monthly Target Setup">
            <span class="nav-icon" aria-hidden="true">T</span>
            <span class="nav-label">Monthly Target Setup</span>
          </button>
        </nav>

        <div class="side-note">
          <span>Demo 数据</span>
          <strong>June 2026 · MTD Day 17/30</strong>
          <p>基于昨天的 Marketing 3.0 目标达成模块规划生成，用于验证看板信息结构。</p>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="viewEyebrow">Brand Dashboard</p>
            <h1 id="viewTitle">Glowsicha Indonesia 月度KOL目标达成</h1>
          </div>
          <div class="control-row">
            <label>
              <span>Brand</span>
              <select id="brandSelect"></select>
            </label>
            <label>
              <span>Month</span>
              <select id="monthSelect"></select>
            </label>
            <label id="picControl" class="is-hidden">
              <span>PIC</span>
              <select id="picSelect"></select>
            </label>
          </div>
        </header>

        <section id="gstView" class="view"></section>
        <section id="leaderView" class="view active"></section>
        <section id="picView" class="view"></section>
        <section id="setupView" class="view"></section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
